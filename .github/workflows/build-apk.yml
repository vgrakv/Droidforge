name: Build APKs from ZIP

# The project sources live directly in this repository. Every push to the main branch builds
# three APKs. You can also run it by hand from the "Actions" tab ("Run workflow").
#
#   lite   - no models inside. The app asks on first run which AI mode to use and downloads
#            the models then (small download, needs internet).
#   basic  - the small explainer model is packed inside (works fully offline).
#   hebrew - the small model AND the Hebrew translator are packed inside (~2.2 GB APK, offline).
#
# The heavy model (~3.9 GB) is too big to pack into an APK, so it is always downloaded
# (or loaded from a file) from the app's AI settings.
#
# If a build fails, open the run page: the reason is shown in the "Summary" box at the top,
# and the full Gradle log is attached at the bottom as "logs-<variant>".
on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
  workflow_dispatch: {}

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: lite
            flags: ''
            experimental: false
          - name: basic
            flags: '-PaiBundle=basic'
            experimental: false
          - name: hebrew
            flags: '-PaiBundle=hebrew'
            # The APK is >2 GB; if the Android packaging tools refuse it, the other two still build.
            experimental: true
    continue-on-error: ${{ matrix.experimental }}
    env:
      # Fixed place for the debug keystore, so the build finds the one created below.
      ANDROID_USER_HOME: ${{ github.workspace }}/../android-user-home

    steps:
      - name: Free disk space (bundled builds are big)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/node_modules || true
          df -h /

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Create the debug signing key with keytool
        # Android Gradle Plugin would generate it itself, but with the build's BouncyCastle
        # libraries that fails ("NoSuchFieldError: xmss_SHAKE128_512ph"). keytool has no such issue.
        run: |
          mkdir -p "$ANDROID_USER_HOME"
          rm -f "$ANDROID_USER_HOME/debug.keystore"
          keytool -genkeypair -keystore "$ANDROID_USER_HOME/debug.keystore" -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          ls -la "$ANDROID_USER_HOME"
          mkdir -p ~/.android && cp "$ANDROID_USER_HOME/debug.keystore" ~/.android/debug.keystore

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Unit tests of the AI helper (lite job only, non-blocking)
        if: matrix.name == 'lite'
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          ./gradlew :core:app:testDebugUnitTest --tests "com.itsaky.androidide.ai.*" --stacktrace 2>&1 | tee "$RUNNER_TEMP/logs/tests.log"

      - name: Build debug APK(s)
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          ./gradlew :core:app:assembleDebug ${{ matrix.flags }} --stacktrace 2>&1 | tee "$RUNNER_TEMP/logs/build.log"

      - name: Show why the build failed
        if: failure()
        shell: bash {0}
        run: |
          LOG="$RUNNER_TEMP/logs/build.log"
          if [ -f "$LOG" ]; then
            ERR=$( { awk '/\* What went wrong:/{f=1} f{print} /\* Try:/{if(f) exit}' "$LOG" | head -25; echo ---; grep -E "(^e: |error:|Could not|FAILED|Exception)" "$LOG" | head -12; echo ---; tail -15 "$LOG"; } | sed 's/%/%25/g' | cut -c1-300 | awk '{printf "%s%%0A", $0}')
          else
            ERR="no build.log was produced"
          fi
          echo "::error title=Build ${{ matrix.name }} failed::$ERR"
          {
            echo "## Build ${{ matrix.name }} failed"
            if [ -f "$LOG" ]; then
              echo
              echo "### What went wrong"
              echo '```'
              awk '/\* What went wrong:/{f=1} f{print} /\* Try:/{if(f) exit}' "$LOG" | head -60
              echo '```'
              echo
              echo "### First error lines"
              echo '```'
              grep -E "(^e: |error:|Could not (find|resolve|get)|No matching variant|Execution failed)" "$LOG" | head -25
              echo '```'
            else
              echo "No Gradle log was produced (the build did not start)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect APKs
        run: |
          mkdir -p out
          find core/app/build/outputs/apk -name '*.apk' | while read -r f; do
            base=$(basename "$f" .apk)
            cp "$f" "out/DroidForge-${{ matrix.name }}-${base#app-}.apk"
          done
          ls -la out

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: DroidForge-${{ matrix.name }}
          path: out/*.apk
          compression-level: 0
          if-no-files-found: error

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.name }}
          path: ${{ runner.temp }}/logs/*.log
          if-no-files-found: ignore
