# Models that can be packed INSIDE the APK (offline builds), e.g.:
#   ./gradlew :core:app:assembleDebug -PaiBundle=basic     -> small model only
#   ./gradlew :core:app:assembleDebug -PaiBundle=hebrew    -> small model + Hebrew translator
# This file must stay in sync with ModelCatalog (ai/ModelCatalog.kt); a unit test checks it.
# The heavy model (~3.9 GB) cannot be bundled: it exceeds the per-file and total APK size limits.

explainer.url=https://huggingface.co/litert-community/Qwen2.5-0.5B-Instruct/resolve/main/Qwen2.5-0.5B-Instruct_multi-prefill-seq_q8_ekv1280.task
explainer.file=Qwen2.5-0.5B-Instruct_q8_ekv1280.task
explainer.minBytes=262144000

translator.url=https://huggingface.co/litert-community/Qwen2.5-1.5B-Instruct/resolve/main/Qwen2.5-1.5B-Instruct_multi-prefill-seq_q8_ekv4096.task
translator.file=Qwen2.5-1.5B-Instruct_q8_ekv4096.task
translator.minBytes=943718400

# bundle name -> models
bundle.basic=explainer
bundle.hebrew=explainer,translator
